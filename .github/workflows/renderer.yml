name: Renderer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/renderer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/renderer.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
